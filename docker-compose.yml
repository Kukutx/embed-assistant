# One command: `docker compose up -d`, then `docker compose exec server node dist/cli/seed.js`
# (or simply run ./scripts/quickstart.sh, which does both).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: embed_assistant
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # localhost only, for scripts/dev.sh
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d embed_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: .
    image: ghcr.io/kukutx/embed-assistant:${EMBED_ASSISTANT_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/embed_assistant
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (run ./scripts/quickstart.sh to generate one)}
    ports:
      - "${PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional local models: `docker compose --profile ollama up -d`, then set OLLAMA_BASE_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  db-data:
  ollama-data:
