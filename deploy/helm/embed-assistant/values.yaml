# Default values for embed-assistant.
# The chart does not run Postgres: point DATABASE_URL at a managed Postgres 15+
# with the pgvector extension (or any Postgres operator you already use).

image:
  repository: ghcr.io/kukutx/embed-assistant
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Public URL visitors and the console use (embed snippets, SSO redirect URI).
publicBaseUrl: "https://assistant.example.com"

# Secret values. Prefer an existing Secret managed by your secret store
# (External Secrets, Sealed Secrets, Vault...): set existingSecret and leave
# `secrets` empty. Keys are environment variable names, for example
# SECRET_KEY, DATABASE_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY,
# EMBEDDINGS_API_KEY, METRICS_TOKEN, PLATFORM_ADMIN_TOKEN, SECRET_KEY_PREVIOUS.
existingSecret: ""
secrets: {}
#  SECRET_KEY: "at-least-32-random-characters..."
#  DATABASE_URL: "postgres://user:password@postgres:5432/embed_assistant?sslmode=require"

# Plain environment variables (see docs/configuration.md).
env:
  LOG_LEVEL: info
  TRUST_PROXY: "true"
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# Model routing file (models.json, see config/models.example.json), mounted
# read-only and passed as MODELS_CONFIG. ${VAR} is replaced from the
# environment, so keep API keys in the Secret. Leave empty to derive models
# from the provider environment variables.
models: {}
#  deployments:
#    - { id: claude, provider: anthropic, model: claude-opus-5-5, apiKey: "${ANTHROPIC_API_KEY}" }
#  aliases: { standard: [claude] }

replicaCount: 2

# Background jobs (crawling, webhook delivery, evaluations). By default every
# replica also runs the job worker (jobs are claimed with SKIP LOCKED, so this
# is safe). Set worker.separate to run them in their own Deployment instead.
worker:
  separate: false
  replicaCount: 1
  resources: {}

resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { memory: 1Gi }

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Answers stream as Server-Sent Events: disable response buffering and allow
  # long-lived responses in your ingress controller, for example (ingress-nginx):
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: assistant.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls: []
  #  - secretName: assistant-tls
  #    hosts: [assistant.example.com]

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Seconds a pod keeps serving after it is marked for termination, so load
# balancers stop sending it new requests before it shuts down. Running answers
# get up to terminationGracePeriodSeconds to finish.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 60

# Prometheus Operator ServiceMonitor for /metrics. When METRICS_TOKEN is set,
# put it in a Secret and reference it with bearerTokenSecret.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
  bearerTokenSecret: {}
  #  name: embed-assistant
  #  key: METRICS_TOKEN

networkPolicy:
  # Restrict ingress to the pods to the ingress controller namespace (egress is
  # left open: model APIs, crawling, webhooks and MCP servers are external).
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
