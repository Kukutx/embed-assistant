{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.SECRET_KEY }}
{{- fail "Set secrets.SECRET_KEY (at least 32 random characters) or use existingSecret" }}
{{- end }}
{{- if not .Values.secrets.DATABASE_URL }}
{{- fail "Set secrets.DATABASE_URL or use existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ea.fullname" . }}
  labels:
    {{- include "ea.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
