{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ea.fullname" . }}
  labels:
    {{- include "ea.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ea.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
        # Same-namespace scrapers and services (e.g. Prometheus sidecars).
        - podSelector: {}
      ports:
        - port: http
{{- end }}
