# One server: Postgres + embed-assistant + Caddy (automatic HTTPS).
# Installed and started by install.sh; settings live in .env next to this file.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: embed_assistant
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d embed_assistant"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    image: ghcr.io/kukutx/embed-assistant:${EMBED_ASSISTANT_VERSION:-latest}
    env_file: .env
    environment:
      # Set DATABASE_URL in .env to use another Postgres (managed, with pgvector).
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@db:5432/embed_assistant}
      PUBLIC_BASE_URL: https://${DOMAIN:?set in .env}
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: a multilingual embedding model on this server, for semantic search with no
  # API key or per-use cost (about 1.3 GB of memory). install.sh LOCAL_EMBEDDINGS=1 turns it on
  # by setting COMPOSE_PROFILES=embeddings and the EMBEDDINGS_* settings in .env.
  embeddings:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    profiles: ["embeddings"]
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # keep the model loaded, so the first question after a quiet hour is not slow
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
  ollama-data:
