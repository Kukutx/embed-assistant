# One server: Postgres + embed-assistant + Caddy (automatic HTTPS).
# Installed and started by install.sh; settings live in .env next to this file.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: embed_assistant
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d embed_assistant"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    image: ghcr.io/kukutx/embed-assistant:${EMBED_ASSISTANT_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/embed_assistant
      PUBLIC_BASE_URL: https://${DOMAIN:?set in .env}
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
